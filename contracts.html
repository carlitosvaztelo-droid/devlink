<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contratos y Pagos - DevLink</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {'sans': ['Inter', 'system-ui', 'sans-serif']},
                    colors: {
                        primary: {light: '#2563eb', DEFAULT: '#3b82f6', dark: '#1e40af'},
                        'gray-950': '#030712',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-white min-h-screen flex overflow-hidden">

    <aside class="w-20 lg:w-72 bg-white dark:bg-gray-900 border-r border-gray-200 dark:border-gray-800 flex flex-col z-30 transition-all">
        <div class="p-6">
            <div class="flex items-center gap-3 mb-10">
                <div class="w-10 h-10 bg-primary rounded-xl flex items-center justify-center text-white shadow-lg shadow-primary/30">
                    <i class="fas fa-link text-xl"></i>
                </div>
                <span class="text-2xl font-bold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-primary to-cyan-400 hidden lg:block">DevLink</span>
            </div>
            <nav id="sidebar-nav" class="space-y-2"></nav>
        </div>
    </aside>

    <main class="flex-1 overflow-y-auto p-8 custom-scrollbar">
        <header class="mb-10">
            <h1 class="text-3xl font-black tracking-tight">Gestión de Contratos</h1>
            <p class="text-gray-500 dark:text-gray-400">Controla hitos, pagos y entregas de proyectos activos.</p>
        </header>

        <div class="grid grid-cols-1 xl:grid-cols-3 gap-8">
            <div class="xl:col-span-2 space-y-6" id="contracts-list">
                </div>

            <div class="space-y-6">
                <div class="bg-gradient-to-br from-gray-900 to-blue-950 p-8 rounded-[2.5rem] text-white shadow-xl relative overflow-hidden">
                    <div class="relative z-10">
                        <h3 class="font-bold text-lg mb-6">Resumen de Cartera</h3>
                        <div class="space-y-4">
                            <div class="flex justify-between items-center py-3 border-b border-white/10">
                                <span class="text-sm text-blue-200" id="label-escrow">En Garantía (Escrow)</span>
                                <span class="font-bold text-lg">REF 800</span>
                            </div>
                            <div class="pt-4">
                                <p class="text-[10px] text-blue-300 uppercase font-bold tracking-widest mb-1" id="label-next">Próximo Movimiento</p>
                                <p class="text-3xl font-black">REF 400</p>
                                <p class="text-[10px] text-blue-400 mt-2 flex items-center gap-1">
                                    <i class="fas fa-shield-alt"></i> Protegido por el sistema DevLink
                                </p>
                            </div>
                        </div>
                    </div>
                    <div class="absolute -bottom-10 -right-10 w-40 h-40 bg-blue-500 rounded-full blur-[80px] opacity-20"></div>
                </div>

                <div class="bg-white dark:bg-gray-900 p-6 rounded-[2.5rem] border border-gray-100 dark:border-gray-800 shadow-sm text-center">
                    <div class="w-12 h-12 bg-red-100 dark:bg-red-900/20 text-red-500 rounded-full flex items-center justify-center mx-auto mb-4 text-xl">
                        <i class="fas fa-headset"></i>
                    </div>
                    <p class="text-sm text-gray-500 mb-4">¿Problemas con un contrato?</p>
                    <button class="w-full py-3 border border-red-500/20 text-red-500 text-xs font-bold rounded-xl hover:bg-red-50 dark:hover:bg-red-900/10 transition-all">
                        ABRIR DISPUTA / SOPORTE
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script src="js/devlink-utils.js"></script>
    <script>
        const user = UserManager.getUser();
        const isClient = UserManager.isClient();

        document.addEventListener('DOMContentLoaded', function() {
            // Sidebar logic
            NavigationGenerator.initSidebar('contracts');

            // Renderizado
            const container = document.getElementById('contracts-list');
            
            // Elementos comunes
            const activeBadge = `<span class="px-3 py-1 bg-green-100 dark:bg-green-900/30 text-green-600 text-[10px] font-bold rounded-full uppercase tracking-widest">Activo</span>`;
            
            if (isClient) {
            document.getElementById('label-escrow').textContent = "Pagado a Escrow";
            document.getElementById('label-next').textContent = "A Liberar";
            
            container.innerHTML = `
                <div class="bg-white dark:bg-gray-900 border border-gray-100 dark:border-gray-800 rounded-[2.5rem] p-8 shadow-sm">
                    <div class="flex justify-between items-start mb-8">
                        <div>
                            ${activeBadge}
                            <h2 class="text-2xl font-bold mt-2">Rediseño Web IUTEPI</h2>
                            <p class="text-sm text-gray-500">Desarrollador: Juan Sánchez</p>
                        </div>
                        <div class="text-right">
                            <p class="text-xs text-gray-400 font-bold uppercase">Total Contrato</p>
                            <p class="text-2xl font-black text-primary">REF 1,200</p>
                        </div>
                    </div>

                    <div class="space-y-4">
                        <h3 class="text-xs font-bold uppercase tracking-wider text-gray-400 mb-4">Hitos de Pago</h3>
                        
                        <div class="flex gap-4 p-4 rounded-2xl bg-gray-50 dark:bg-gray-800/50 border border-gray-100 dark:border-gray-700 opacity-70">
                            <div class="w-10 h-10 rounded-full bg-green-500 text-white flex items-center justify-center shrink-0"><i class="fas fa-check"></i></div>
                            <div class="flex-1">
                                <h4 class="font-bold text-sm">Hito 1: Mockups UI</h4>
                                <p class="text-xs text-green-600 font-bold mt-1">FONDOS LIBERADOS</p>
                            </div>
                        </div>

                        <div class="flex gap-4 p-4 rounded-2xl bg-blue-50/50 dark:bg-blue-900/10 border border-primary/20">
                            <div class="w-10 h-10 rounded-full bg-primary text-white flex items-center justify-center shrink-0 animate-pulse"><i class="fas fa-unlock"></i></div>
                            <div class="flex-1">
                                <div class="flex justify-between items-center">
                                    <h4 class="font-bold text-sm">Hito 2: Desarrollo Frontend</h4>
                                    <span class="text-xs font-bold text-primary bg-primary/10 px-2 py-1 rounded">ENTREGADO</span>
                                </div>
                                <p class="text-xs text-gray-500 mt-2 mb-3">El desarrollador ha marcado este hito como completo. Revisa y libera los fondos.</p>
                                <div class="flex gap-2">
                                    <button class="px-4 py-2 bg-green-500 hover:bg-green-600 text-white text-[10px] font-bold rounded-lg shadow-lg transition-all">LIBERAR REF 400</button>
                                    <button class="px-4 py-2 border border-red-200 text-red-500 hover:bg-red-50 text-[10px] font-bold rounded-lg transition-all">SOLICITAR CAMBIOS</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            } else {
            // Vista Dev
            document.getElementById('label-escrow').textContent = "Fondos Asegurados";
            document.getElementById('label-next').textContent = "A Cobrar Pronto";

            container.innerHTML = `
                <div class="bg-white dark:bg-gray-900 border border-gray-100 dark:border-gray-800 rounded-[2.5rem] p-8 shadow-sm">
                    <div class="flex justify-between items-start mb-8">
                        <div>
                            ${activeBadge}
                            <h2 class="text-2xl font-bold mt-2">Rediseño Web IUTEPI</h2>
                            <p class="text-sm text-gray-500">Cliente: TechSolutions Guanare</p>
                        </div>
                        <div class="text-right">
                            <p class="text-xs text-gray-400 font-bold uppercase">Tu Ganancia</p>
                            <p class="text-2xl font-black text-primary">REF 1,200</p>
                        </div>
                    </div>

                    <div class="space-y-4">
                        <h3 class="text-xs font-bold uppercase tracking-wider text-gray-400 mb-4">Progreso del Proyecto</h3>
                        
                        <div class="flex gap-4 p-4 rounded-2xl bg-gray-50 dark:bg-gray-800/50 border border-gray-100 dark:border-gray-700">
                            <div class="w-10 h-10 rounded-full bg-green-500 text-white flex items-center justify-center shrink-0"><i class="fas fa-wallet"></i></div>
                            <div class="flex-1">
                                <h4 class="font-bold text-sm">Hito 1: Mockups UI</h4>
                                <p class="text-xs text-gray-500 mt-1">Cobrado el 15 Feb</p>
                            </div>
                        </div>

                        <div class="flex gap-4 p-4 rounded-2xl bg-blue-50/50 dark:bg-blue-900/10 border border-primary/20">
                            <div class="w-10 h-10 rounded-full bg-white dark:bg-gray-800 text-primary border-2 border-primary flex items-center justify-center shrink-0"><i class="fas fa-code"></i></div>
                            <div class="flex-1">
                                <div class="flex justify-between items-center">
                                    <h4 class="font-bold text-sm">Hito 2: Desarrollo Frontend</h4>
                                    <span class="text-xs font-bold text-orange-500">EN REVISIÓN</span>
                                </div>
                                <p class="text-xs text-gray-500 mt-2 mb-3">Esperando aprobación del cliente.</p>
                                <button disabled class="w-full py-2 bg-gray-200 dark:bg-gray-700 text-gray-400 text-[10px] font-bold rounded-lg cursor-not-allowed">ENTREGADO</button>
                            </div>
                        </div>

                        <div class="flex gap-4 p-4 rounded-2xl bg-transparent border border-gray-100 dark:border-gray-800 opacity-50">
                             <div class="w-10 h-10 rounded-full bg-gray-200 dark:bg-gray-700 text-gray-500 flex items-center justify-center shrink-0">3</div>
                             <div class="flex-1 pt-2">
                                <h4 class="font-bold text-sm">Hito 3: Integración Backend</h4>
                             </div>
                        </div>
                    </div>
                </div>
            `;
            }
        });
    </script>
</body>
</html>
