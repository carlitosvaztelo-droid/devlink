<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mensajes - DevLink</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {'sans': ['Inter', 'system-ui', 'sans-serif']},
                    colors: {
                        primary: {light: '#2563eb', DEFAULT: '#3b82f6', dark: '#1e40af'},
                        'gray-950': '#030712',
                    }
                }
            }
        }
    </script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 10px; }
        .chat-bubble-in { border-radius: 0 20px 20px 20px; }
        .chat-bubble-out { border-radius: 20px 0 20px 20px; }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-white min-h-screen flex overflow-hidden">

    <aside class="w-20 lg:w-72 bg-white dark:bg-gray-900 border-r border-gray-200 dark:border-gray-800 flex flex-col z-30 transition-all">
        <div class="p-6">
            <div class="flex items-center gap-3 mb-10">
                <div class="w-10 h-10 bg-primary rounded-xl flex items-center justify-center text-white shadow-lg shadow-primary/30">
                    <i class="fas fa-link text-xl"></i>
                </div>
                <span class="text-2xl font-bold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-primary to-cyan-400 hidden lg:block">DevLink</span>
            </div>
            <nav id="sidebar-nav" class="space-y-2"></nav>
        </div>
    </aside>

    <main class="flex-1 flex flex-col min-w-0 bg-white dark:bg-gray-950">
        <header class="h-20 border-b border-gray-100 dark:border-gray-800 px-6 flex items-center justify-between bg-white dark:bg-gray-900">
            <div class="flex items-center gap-4">
                <div class="relative">
                    <div class="w-10 h-10 rounded-full bg-gray-200 dark:bg-gray-700 flex items-center justify-center font-bold text-gray-500" id="chat-avatar"></div>
                    <span class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 border-2 border-white dark:border-gray-900 rounded-full"></span>
                </div>
                <div>
                    <h2 class="font-bold text-gray-900 dark:text-white leading-tight" id="chat-name">Cargando...</h2>
                    <p class="text-xs text-green-500 font-medium tracking-wide">En línea ahora</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button class="w-10 h-10 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 text-gray-400 hover:text-primary transition-colors flex items-center justify-center"><i class="fas fa-phone-alt"></i></button>
                <button class="w-10 h-10 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 text-gray-400 hover:text-primary transition-colors flex items-center justify-center"><i class="fas fa-video"></i></button>
                <button class="w-10 h-10 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 text-gray-400 hover:text-primary transition-colors flex items-center justify-center"><i class="fas fa-ellipsis-v"></i></button>
            </div>
        </header>

        <div class="flex-1 overflow-y-auto p-8 space-y-6 custom-scrollbar bg-gray-50 dark:bg-gray-950" id="chat-container">
            <div class="flex items-end gap-3 max-w-[85%] md:max-w-[70%]">
                <div class="w-8 h-8 rounded-full bg-gray-200 dark:bg-gray-700 flex items-center justify-center text-xs font-bold shrink-0" id="msg-avatar-initial">?</div>
                <div>
                    <div class="bg-white dark:bg-gray-800 p-4 chat-bubble-in shadow-sm border border-gray-100 dark:border-gray-800">
                        <p class="text-sm leading-relaxed" id="msg-content">Hola, ¿cómo estás? Quería revisar los últimos cambios que subiste.</p>
                    </div>
                    <span class="text-[10px] text-gray-400 mt-1 ml-1">10:45 AM</span>
                </div>
            </div>

            <div class="flex items-end gap-3 max-w-[85%] md:max-w-[70%] ml-auto flex-row-reverse">
                <div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center text-[10px] font-bold text-white shrink-0">YO</div>
                <div class="text-right">
                    <div class="bg-primary p-4 chat-bubble-out shadow-lg shadow-primary/20 text-white">
                        <p class="text-sm leading-relaxed">¡Hola! Claro, ya subí todo al repositorio. ¿Pudiste verlo?</p>
                    </div>
                    <span class="text-[10px] text-gray-400 mt-1 mr-1">10:48 AM <i class="fas fa-check-double text-primary"></i></span>
                </div>
            </div>
        </div>

        <footer class="p-6 bg-white dark:bg-gray-900 border-t border-gray-100 dark:border-gray-800">
            <form id="chat-form" class="flex items-center gap-3">
                <button type="button" class="p-3 text-gray-400 hover:text-primary transition-colors hover:bg-gray-50 dark:hover:bg-gray-800 rounded-xl"><i class="fas fa-paperclip"></i></button>
                <div class="flex-1 bg-gray-50 dark:bg-gray-800 rounded-2xl border border-gray-200 dark:border-gray-700 focus-within:border-primary focus-within:ring-2 focus-within:ring-primary/20 transition-all flex items-center px-4 py-3">
                    <input type="text" id="chat-input" placeholder="Escribe un mensaje..." class="flex-1 bg-transparent border-none outline-none text-sm dark:placeholder-gray-500">
                    <button type="button" class="ml-2 text-gray-400 hover:text-primary"><i class="far fa-smile"></i></button>
                </div>
                <button type="submit" class="w-12 h-12 bg-primary hover:bg-primary-dark text-white rounded-xl shadow-lg shadow-primary/30 transition-all flex items-center justify-center transform hover:scale-105 active:scale-95">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </form>
        </footer>
    </main>

    <script src="js/devlink-utils.js"></script>
    <script>
        const user = UserManager.getUser();
        const isClient = UserManager.isClient();

        document.addEventListener('DOMContentLoaded', function() {
            // Sidebar
            NavigationGenerator.initSidebar('messages');

            // Datos del Chat (Simulación)
            const chatName = isClient ? 'Juan Sánchez' : 'TechSolutions Guanare';
            const chatInitial = isClient ? 'JS' : 'TS';
            const initialMsg = isClient 
                ? 'Hola, ¿cómo vas con los avances del Hito 1? Me gustaría ver los mockups.' 
                : 'Hola, hemos revisado tu propuesta y nos interesa tu perfil para el proyecto.';

            document.getElementById('chat-name').textContent = chatName;
            document.getElementById('chat-avatar').textContent = chatInitial;
            document.getElementById('msg-avatar-initial').textContent = chatInitial;
            document.getElementById('msg-content').textContent = initialMsg;

            // Chat Logic
            document.getElementById('chat-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const input = document.getElementById('chat-input');
            if (!input.value.trim()) return;

            const container = document.getElementById('chat-container');
            const msg = `
                <div class="flex items-end gap-3 max-w-[85%] md:max-w-[70%] ml-auto flex-row-reverse animate-fade-in-up">
                    <div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center text-[10px] font-bold text-white shrink-0">YO</div>
                    <div class="text-right">
                        <div class="bg-primary p-4 chat-bubble-out shadow-lg shadow-primary/20 text-white">
                            <p class="text-sm leading-relaxed">${input.value}</p>
                        </div>
                        <span class="text-[10px] text-gray-400 mt-1 mr-1">Justo ahora</span>
                    </div>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', msg);
            input.value = '';
            container.scrollTop = container.scrollHeight;
        });

            // Theme Init
            if (ThemeManager.isDark()) {
                document.documentElement.classList.add('dark');
            }
        });
    </script>
</body>
</html>
