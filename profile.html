<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - DevLink</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {'sans': ['Inter', 'system-ui', 'sans-serif']},
                    colors: {
                        primary: {light: '#2563eb', DEFAULT: '#3b82f6', dark: '#1e40af'},
                        'gray-950': '#030712',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-white min-h-screen flex overflow-hidden">

    <aside class="w-20 lg:w-72 bg-white dark:bg-gray-900 border-r border-gray-200 dark:border-gray-800 flex flex-col z-30 transition-all">
        <div class="p-6">
            <div class="flex items-center gap-3 mb-10">
                <div class="w-10 h-10 bg-primary rounded-xl flex items-center justify-center text-white shadow-lg shadow-primary/30">
                    <i class="fas fa-link text-xl"></i>
                </div>
                <span class="text-2xl font-bold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-primary to-cyan-400 hidden lg:block">DevLink</span>
            </div>
            <nav id="sidebar-nav" class="space-y-2"></nav>
        </div>
    </aside>

    <main class="flex-1 overflow-y-auto custom-scrollbar">
        <div class="h-64 bg-gradient-to-r from-primary to-blue-400 relative overflow-hidden">
            <div class="absolute inset-0 bg-[url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAiIGhlaWdodD0iMjAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PGNpcmNsZSBjeD0iMSIgY3k9IjEiIHI9IjEiIGZpbGw9InJnYmEoMjU1LDI1NSwyNTUsMC4xKSIvPjwvc3ZnPg==')] opacity-30"></div>
            
            <div class="absolute -bottom-16 left-8 lg:left-16 flex items-end gap-8">
                <div class="w-32 h-32 lg:w-40 lg:h-40 rounded-[2.5rem] bg-white dark:bg-gray-900 p-2 shadow-2xl z-10">
                    <div class="w-full h-full rounded-[2rem] bg-gradient-to-tr from-gray-100 to-gray-200 dark:from-gray-800 dark:to-gray-700 flex items-center justify-center text-4xl font-black text-gray-400" id="profile-initials">
                        --
                    </div>
                </div>
                <div class="mb-6 z-10">
                    <h1 class="text-3xl font-black text-white drop-shadow-md" id="profile-name">Cargando...</h1>
                    <p class="text-blue-100 font-medium text-lg flex items-center gap-2">
                        <span id="profile-role">...</span>
                        <i class="fas fa-check-circle text-white" title="Verificado"></i>
                    </p>
                </div>
            </div>
        </div>

        <div class="mt-20 px-8 lg:px-16 pb-12 grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="space-y-6">
                <div class="bg-white dark:bg-gray-900 p-8 rounded-3xl border border-gray-100 dark:border-gray-800 shadow-sm">
                    <h3 class="font-bold mb-6 flex items-center gap-2 text-lg">
                        <i class="fas fa-info-circle text-primary"></i> Información
                    </h3>
                    <div class="space-y-5 text-sm">
                        <div class="flex justify-between items-center">
                            <span class="text-gray-500">Ubicación</span>
                            <span class="font-bold text-gray-900 dark:text-white">Guanare, VE</span>
                        </div>
                        <div class="flex justify-between items-center">
                            <span class="text-gray-500">Miembro desde</span>
                            <span class="font-bold text-gray-900 dark:text-white">Enero 2024</span>
                        </div>
                        <div class="flex justify-between items-center">
                            <span class="text-gray-500">Reputación</span>
                            <span class="font-bold text-yellow-500 flex items-center gap-1">4.8 <i class="fas fa-star text-xs"></i></span>
                        </div>
                    </div>
                    <button class="w-full mt-8 py-3 border border-gray-200 dark:border-gray-700 rounded-xl text-xs font-bold hover:bg-gray-50 dark:hover:bg-gray-800 transition-all">
                        EDITAR PERFIL
                    </button>
                </div>

                <div id="skills-card" class="bg-white dark:bg-gray-900 p-8 rounded-3xl border border-gray-100 dark:border-gray-800 shadow-sm hidden">
                    <h3 class="font-bold mb-6 flex items-center gap-2 text-lg">
                        <i class="fas fa-code text-primary"></i> Habilidades
                    </h3>
                    <div class="flex flex-wrap gap-2">
                        <span class="px-3 py-1.5 bg-blue-50 dark:bg-blue-900/20 text-primary text-xs font-bold rounded-lg border border-blue-100 dark:border-blue-800">PHP / Laravel</span>
                        <span class="px-3 py-1.5 bg-blue-50 dark:bg-blue-900/20 text-primary text-xs font-bold rounded-lg border border-blue-100 dark:border-blue-800">Tailwind CSS</span>
                        <span class="px-3 py-1.5 bg-blue-50 dark:bg-blue-900/20 text-primary text-xs font-bold rounded-lg border border-blue-100 dark:border-blue-800">MySQL</span>
                        <span class="px-3 py-1.5 bg-blue-50 dark:bg-blue-900/20 text-primary text-xs font-bold rounded-lg border border-blue-100 dark:border-blue-800">JavaScript</span>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-2 space-y-8">
                <div class="bg-white dark:bg-gray-900 p-8 rounded-3xl border border-gray-100 dark:border-gray-800 shadow-sm">
                    <h3 class="text-xl font-bold mb-4">Sobre mí / Empresa</h3>
                    <p class="text-gray-600 dark:text-gray-300 leading-relaxed text-lg" id="profile-bio">
                        Cargando biografía...
                    </p>
                </div>

                <div>
                    <h3 class="text-xl font-bold mb-6" id="grid-title">Portafolio Destacado</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6" id="dynamic-grid">
                        </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const user = JSON.parse(localStorage.getItem('devlink_demo_user')) || { type: 'dev', nombre: 'Usuario', apellido: 'Demo' };
        const isClient = user.type === 'client';

        // Sidebar
        const nav = document.getElementById('sidebar-nav');
        const dashboardUrl = isClient ? 'dashboard_cliente.html' : 'dashboard_desarrollador.html';
        nav.innerHTML = `
            <a href="${dashboardUrl}" class="flex items-center gap-3 px-4 py-3 text-gray-500 hover:text-primary hover:bg-blue-50 dark:hover:bg-gray-800 rounded-xl transition-all">
                <i class="fas fa-th-large w-5"></i><span class="font-medium hidden lg:block">Dashboard</span>
            </a>
            <a href="projects.html" class="flex items-center gap-3 px-4 py-3 text-gray-500 hover:text-primary hover:bg-blue-50 dark:hover:bg-gray-800 rounded-xl transition-all">
                <i class="fas fa-layer-group w-5"></i><span class="font-medium hidden lg:block">${isClient ? 'Mis Publicaciones' : 'Explorar Proyectos'}</span>
            </a>
            <a href="proposals.html" class="flex items-center gap-3 px-4 py-3 text-gray-500 hover:text-primary hover:bg-blue-50 dark:hover:bg-gray-800 rounded-xl transition-all">
                <i class="fas fa-file-alt w-5"></i><span class="font-medium hidden lg:block">${isClient ? 'Candidatos' : 'Mis Postulaciones'}</span>
            </a>
            <a href="contracts.html" class="flex items-center gap-3 px-4 py-3 text-gray-500 hover:text-primary hover:bg-blue-50 dark:hover:bg-gray-800 rounded-xl transition-all">
                <i class="fas fa-file-signature w-5"></i><span class="font-medium hidden lg:block">Contratos</span>
            </a>
            <a href="messages.html" class="flex items-center gap-3 px-4 py-3 text-gray-500 hover:text-primary hover:bg-blue-50 dark:hover:bg-gray-800 rounded-xl transition-all">
                <i class="fas fa-comment-dots w-5"></i><span class="font-medium hidden lg:block">Mensajes</span>
            </a>
             <a href="profile.html" class="flex items-center gap-3 px-4 py-3 bg-primary text-white rounded-xl shadow-lg shadow-primary/30">
                <i class="fas fa-user-circle w-5"></i><span class="font-medium hidden lg:block">Mi Perfil</span>
            </a>
        `;

        // Datos del Perfil
        document.getElementById('profile-name').textContent = `${user.nombre} ${user.apellido}`;
        document.getElementById('profile-initials').textContent = (user.nombre[0] + user.apellido[0]).toUpperCase();

        const gridContainer = document.getElementById('dynamic-grid');

        if (isClient) {
            document.getElementById('profile-role').textContent = user.company || 'Cliente / Empresa';
            document.getElementById('profile-bio').textContent = "Somos una empresa local dedicada a impulsar el comercio en Guanare a través de soluciones tecnológicas innovadoras. Buscamos talento comprometido.";
            document.getElementById('grid-title').textContent = "Historial de Proyectos";
            
            gridContainer.innerHTML = `
                <div class="bg-white dark:bg-gray-900 p-6 rounded-3xl border border-gray-100 dark:border-gray-800 hover:shadow-lg transition-all group cursor-pointer">
                    <div class="w-12 h-12 bg-green-100 dark:bg-green-900/30 text-green-600 rounded-xl flex items-center justify-center text-xl mb-4">
                        <i class="fas fa-check"></i>
                    </div>
                    <h4 class="font-bold text-lg mb-1 group-hover:text-primary transition-colors">Sistema de Inventario</h4>
                    <p class="text-sm text-gray-500">Finalizado en Dic 2023</p>
                </div>
            `;
        } else {
            // Vista Dev
            document.getElementById('skills-card').classList.remove('hidden');
            document.getElementById('profile-role').textContent = 'Desarrollador Fullstack';
            document.getElementById('profile-bio').textContent = "Desarrollador apasionado por crear soluciones eficientes en PHP y JavaScript. Especializado en optimización de bases de datos y arquitecturas escalables para entornos locales.";
            
            gridContainer.innerHTML = `
                <div class="bg-gradient-to-br from-gray-900 to-blue-950 p-8 rounded-3xl text-white relative overflow-hidden group cursor-pointer border border-white/10 hover:-translate-y-1 transition-transform">
                    <div class="relative z-10">
                        <h4 class="font-bold text-xl mb-2">E-commerce Local</h4>
                        <p class="text-blue-200 text-sm">Plataforma de ventas integrada con pasarelas nacionales.</p>
                        <div class="mt-4 flex gap-2">
                            <span class="px-2 py-1 bg-white/10 rounded text-[10px]">Laravel</span>
                            <span class="px-2 py-1 bg-white/10 rounded text-[10px]">Vue.js</span>
                        </div>
                    </div>
                    <i class="fas fa-external-link-alt absolute top-6 right-6 opacity-0 group-hover:opacity-100 transition-opacity"></i>
                    <div class="absolute -bottom-10 -right-10 w-32 h-32 bg-primary blur-[60px] opacity-40"></div>
                </div>

                <div class="bg-gradient-to-br from-gray-900 to-purple-900 p-8 rounded-3xl text-white relative overflow-hidden group cursor-pointer border border-white/10 hover:-translate-y-1 transition-transform">
                    <div class="relative z-10">
                        <h4 class="font-bold text-xl mb-2">Sistema Educativo</h4>
                        <p class="text-purple-200 text-sm">Gestión de notas y estudiantes para institución local.</p>
                         <div class="mt-4 flex gap-2">
                            <span class="px-2 py-1 bg-white/10 rounded text-[10px]">PHP Puro</span>
                            <span class="px-2 py-1 bg-white/10 rounded text-[10px]">MySQL</span>
                        </div>
                    </div>
                    <i class="fas fa-external-link-alt absolute top-6 right-6 opacity-0 group-hover:opacity-100 transition-opacity"></i>
                </div>
            `;
        }

        // Theme Init
        if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }
    </script>
</body>
</html>
