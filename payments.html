<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagos y Finanzas - DevLink</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {'sans': ['Inter', 'system-ui', 'sans-serif']},
                    colors: {
                        primary: {light: '#2563eb', DEFAULT: '#3b82f6', dark: '#1e40af'},
                        'gray-950': '#030712',
                    }
                }
            }
        }
    </script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 20px; }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-white min-h-screen flex overflow-hidden transition-colors duration-300">

    <aside class="w-20 lg:w-72 bg-white dark:bg-gray-900 border-r border-gray-200 dark:border-gray-800 flex flex-col z-30 transition-all">
        <div class="p-6">
            <div class="flex items-center gap-3 mb-10">
                <div class="w-10 h-10 bg-primary rounded-xl flex items-center justify-center text-white shadow-lg shadow-primary/30">
                    <i class="fas fa-link text-xl"></i>
                </div>
                <span class="text-2xl font-bold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-primary to-cyan-400 hidden lg:block">DevLink</span>
            </div>
            <nav id="sidebar-nav" class="space-y-2"></nav>
        </div>
    </aside>

    <main class="flex-1 overflow-y-auto p-8 custom-scrollbar">
        <header class="mb-10 flex justify-between items-center">
            <div>
                <h1 class="text-3xl font-black tracking-tight" id="page-title">Finanzas</h1>
                <p class="text-gray-500 dark:text-gray-400 mt-1">Resumen de movimientos y saldo.</p>
            </div>
            <button class="bg-primary hover:bg-primary-dark text-white px-6 py-3 rounded-xl font-bold shadow-lg shadow-primary/20 transition-all flex items-center gap-2">
                <i class="fas fa-download"></i> <span class="hidden sm:inline">Descargar Reporte</span>
            </button>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-8 mb-10" id="finance-cards">
            </div>

        <div class="grid grid-cols-1 xl:grid-cols-3 gap-8">
            <div class="xl:col-span-2 bg-white dark:bg-gray-900 rounded-[2.5rem] border border-gray-200 dark:border-gray-800 p-8 shadow-sm">
                <h3 class="font-bold text-xl mb-6">Historial de Transacciones</h3>
                <div class="space-y-4" id="transactions-list">
                    </div>
            </div>

            <div class="space-y-6">
                <div class="bg-gray-900 dark:bg-gray-800 text-white rounded-[2.5rem] p-8 shadow-xl relative overflow-hidden">
                    <div class="relative z-10">
                        <h3 class="font-bold text-lg mb-6" id="payment-method-title">Método de Pago Principal</h3>
                        <div class="bg-white/10 backdrop-blur-md rounded-2xl p-4 border border-white/10 mb-4 flex items-center gap-4">
                            <div class="w-12 h-12 bg-blue-600 rounded-xl flex items-center justify-center text-2xl">
                                <i class="fab fa-cc-visa"></i>
                            </div>
                            <div>
                                <p class="font-bold text-sm">Visa terminada en 4242</p>
                                <p class="text-xs text-blue-200">Expira 12/28</p>
                            </div>
                        </div>
                        <button class="w-full py-3 bg-white text-gray-900 font-bold text-xs rounded-xl hover:bg-gray-100 transition-colors">
                            GESTIONAR MÉTODOS
                        </button>
                    </div>
                    <div class="absolute top-0 right-0 w-40 h-40 bg-primary blur-[80px] opacity-30"></div>
                </div>

                <div class="bg-white dark:bg-gray-900 rounded-[2.5rem] border border-gray-200 dark:border-gray-800 p-8 shadow-sm">
                    <h3 class="font-bold text-lg mb-4">Información Fiscal</h3>
                    <div class="space-y-3 text-sm text-gray-600 dark:text-gray-400">
                        <div class="flex justify-between">
                            <span>RIF/ID</span>
                            <span class="font-medium text-gray-900 dark:text-white" id="tax-id">J-12345678-0</span>
                        </div>
                        <div class="flex justify-between">
                            <span>Dirección</span>
                            <span class="font-medium text-gray-900 dark:text-white">Guanare, VE</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="js/devlink-utils.js"></script>
    <script>
        const user = UserManager.getUser();
        const isClient = UserManager.isClient();
        
        document.addEventListener('DOMContentLoaded', function() {
            // Sidebar
            NavigationGenerator.initSidebar('payments');

            // Renderizado Condicional
            const cardsContainer = document.getElementById('finance-cards');
            const transactionsList = document.getElementById('transactions-list');
            const paymentMethodTitle = document.getElementById('payment-method-title');

        if (isClient) {
            // VISTA CLIENTE
            document.getElementById('page-title').textContent = "Pagos y Facturación";
            paymentMethodTitle.textContent = "Método de Pago";
            
            cardsContainer.innerHTML = `
                <div class="bg-gradient-to-br from-blue-500 to-blue-700 rounded-3xl p-6 text-white shadow-lg shadow-blue-500/20 relative overflow-hidden">
                    <div class="relative z-10">
                        <p class="text-blue-100 text-xs font-bold uppercase tracking-wider mb-1">Total Invertido</p>
                        <h2 class="text-3xl font-black">REF 2,400</h2>
                        <p class="text-xs mt-2 opacity-80">En proyectos finalizados</p>
                    </div>
                    <i class="fas fa-chart-line absolute -bottom-4 -right-4 text-8xl text-white/10"></i>
                </div>

                <div class="bg-white dark:bg-gray-900 rounded-3xl p-6 border border-gray-200 dark:border-gray-800 shadow-sm">
                    <div class="flex justify-between items-start mb-2">
                        <div class="w-10 h-10 bg-orange-100 dark:bg-orange-900/20 text-orange-500 rounded-xl flex items-center justify-center"><i class="fas fa-shield-alt"></i></div>
                    </div>
                    <p class="text-gray-500 text-xs font-bold uppercase tracking-wider mb-1">En Escrow (Garantía)</p>
                    <h2 class="text-2xl font-bold text-gray-900 dark:text-white">REF 800</h2>
                </div>

                <div class="bg-white dark:bg-gray-900 rounded-3xl p-6 border border-gray-200 dark:border-gray-800 shadow-sm">
                    <div class="flex justify-between items-start mb-2">
                         <div class="w-10 h-10 bg-green-100 dark:bg-green-900/20 text-green-500 rounded-xl flex items-center justify-center"><i class="fas fa-file-invoice-dollar"></i></div>
                    </div>
                    <p class="text-gray-500 text-xs font-bold uppercase tracking-wider mb-1">Pendiente de Pago</p>
                    <h2 class="text-2xl font-bold text-gray-900 dark:text-white">REF 0</h2>
                </div>
            `;

            transactionsList.innerHTML = `
                <div class="flex items-center justify-between p-4 bg-gray-50 dark:bg-gray-800 rounded-2xl">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 bg-white dark:bg-gray-700 rounded-xl flex items-center justify-center text-red-500 font-bold"><i class="fas fa-arrow-up"></i></div>
                        <div>
                            <h4 class="font-bold text-sm">Pago a Escrow: Proyecto Web</h4>
                            <p class="text-xs text-gray-500">15 Feb, 2024 • ID: #TX-9821</p>
                        </div>
                    </div>
                    <span class="font-bold text-red-500">- REF 400.00</span>
                </div>
                <div class="flex items-center justify-between p-4 bg-gray-50 dark:bg-gray-800 rounded-2xl">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 bg-white dark:bg-gray-700 rounded-xl flex items-center justify-center text-red-500 font-bold"><i class="fas fa-arrow-up"></i></div>
                        <div>
                            <h4 class="font-bold text-sm">Pago a Escrow: App Delivery</h4>
                            <p class="text-xs text-gray-500">10 Ene, 2024 • ID: #TX-8821</p>
                        </div>
                    </div>
                    <span class="font-bold text-red-500">- REF 800.00</span>
                </div>
            `;
        } else {
            // VISTA DESARROLLADOR
            document.getElementById('page-title').textContent = "Mis Ingresos";
            paymentMethodTitle.textContent = "Método de Retiro";

            cardsContainer.innerHTML = `
                <div class="bg-gradient-to-br from-green-500 to-green-700 rounded-3xl p-6 text-white shadow-lg shadow-green-500/20 relative overflow-hidden">
                    <div class="relative z-10">
                        <p class="text-green-100 text-xs font-bold uppercase tracking-wider mb-1">Disponible para Retiro</p>
                        <h2 class="text-3xl font-black">REF 1,200</h2>
                        <button class="mt-4 bg-white/20 hover:bg-white/30 text-white text-xs font-bold py-2 px-4 rounded-lg transition-colors">SOLICITAR RETIRO</button>
                    </div>
                    <i class="fas fa-wallet absolute -bottom-4 -right-4 text-8xl text-white/10"></i>
                </div>

                <div class="bg-white dark:bg-gray-900 rounded-3xl p-6 border border-gray-200 dark:border-gray-800 shadow-sm">
                     <div class="flex justify-between items-start mb-2">
                        <div class="w-10 h-10 bg-blue-100 dark:bg-blue-900/20 text-primary rounded-xl flex items-center justify-center"><i class="fas fa-hourglass-half"></i></div>
                    </div>
                    <p class="text-gray-500 text-xs font-bold uppercase tracking-wider mb-1">Próximos Pagos</p>
                    <h2 class="text-2xl font-bold text-gray-900 dark:text-white">REF 400</h2>
                </div>

                <div class="bg-white dark:bg-gray-900 rounded-3xl p-6 border border-gray-200 dark:border-gray-800 shadow-sm">
                     <div class="flex justify-between items-start mb-2">
                        <div class="w-10 h-10 bg-purple-100 dark:bg-purple-900/20 text-purple-500 rounded-xl flex items-center justify-center"><i class="fas fa-piggy-bank"></i></div>
                    </div>
                    <p class="text-gray-500 text-xs font-bold uppercase tracking-wider mb-1">Total Ganado (Año)</p>
                    <h2 class="text-2xl font-bold text-gray-900 dark:text-white">REF 3,500</h2>
                </div>
            `;

            transactionsList.innerHTML = `
                <div class="flex items-center justify-between p-4 bg-gray-50 dark:bg-gray-800 rounded-2xl">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 bg-white dark:bg-gray-700 rounded-xl flex items-center justify-center text-green-500 font-bold"><i class="fas fa-arrow-down"></i></div>
                        <div>
                            <h4 class="font-bold text-sm">Pago Recibido: Hito 1 App</h4>
                            <p class="text-xs text-gray-500">14 Feb, 2024 • De: Escrow DevLink</p>
                        </div>
                    </div>
                    <span class="font-bold text-green-500">+ REF 400.00</span>
                </div>
                <div class="flex items-center justify-between p-4 bg-gray-50 dark:bg-gray-800 rounded-2xl">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 bg-white dark:bg-gray-700 rounded-xl flex items-center justify-center text-gray-400 font-bold"><i class="fas fa-university"></i></div>
                        <div>
                            <h4 class="font-bold text-sm">Retiro a Cuenta Bancaria</h4>
                            <p class="text-xs text-gray-500">01 Feb, 2024 • Procesado</p>
                        </div>
                    </div>
                    <span class="font-bold text-gray-500">- REF 1,000.00</span>
                </div>
            `;
        }

            // Theme Toggle  
            const themeToggleBtn = document.getElementById('theme-toggle');
            if (themeToggleBtn) {
                themeToggleBtn.addEventListener('click', () => ThemeManager.toggle());
            }
        });
    </script>
</body>
</html>
