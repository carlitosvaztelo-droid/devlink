<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyectos - DevLink</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {'sans': ['Inter', 'system-ui', 'sans-serif']},
                    colors: {
                        primary: {light: '#2563eb', DEFAULT: '#3b82f6', dark: '#1e40af'},
                        'gray-950': '#030712',
                    }
                }
            }
        }
    </script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 20px; }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-white min-h-screen flex overflow-hidden transition-colors duration-300">

    <aside class="w-20 lg:w-72 bg-white dark:bg-gray-900 border-r border-gray-200 dark:border-gray-800 flex flex-col z-30 transition-all">
        <div class="p-6">
            <div class="flex items-center gap-3 mb-10">
                <div class="w-10 h-10 bg-primary rounded-xl flex items-center justify-center text-white shadow-lg shadow-primary/30">
                    <i class="fas fa-link text-xl"></i>
                </div>
                <span class="text-2xl font-bold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-primary to-cyan-400 hidden lg:block">DevLink</span>
            </div>
            <nav id="sidebar-nav" class="space-y-2"></nav>
        </div>
        <div class="mt-auto p-6 border-t border-gray-100 dark:border-gray-800">
            <button id="theme-toggle" class="w-full flex items-center justify-center lg:justify-start gap-3 px-4 py-3 text-gray-500 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-xl transition-all">
                <i id="theme-icon" class="fas fa-moon w-5"></i>
                <span id="theme-text" class="font-medium hidden lg:block">Modo Oscuro</span>
            </button>
        </div>
    </aside>

    <main class="flex-1 flex flex-col min-w-0 overflow-hidden">
        <header class="h-20 bg-white/80 dark:bg-gray-900/80 backdrop-blur-md border-b border-gray-200 dark:border-gray-800 px-8 flex items-center justify-between z-20">
            <div>
                <h2 id="page-title" class="text-2xl font-black tracking-tight">Proyectos</h2>
                <p id="page-subtitle" class="text-xs text-gray-500 dark:text-gray-400 font-medium">Gestiona y explora oportunidades.</p>
            </div>
            <div class="flex items-center gap-4">
                <div id="header-action-btn"></div>
                <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-primary to-purple-500 flex items-center justify-center text-white font-bold shadow-md" id="user-avatar">U</div>
            </div>
        </header>

        <div class="flex-1 overflow-y-auto p-8 custom-scrollbar">
            <div id="filters-section" class="mb-8 hidden">
                <div class="bg-white dark:bg-gray-900 p-4 rounded-2xl border border-gray-200 dark:border-gray-800 shadow-sm flex flex-col md:flex-row gap-4">
                    <div class="flex-1 relative">
                        <i class="fas fa-search absolute left-4 top-3.5 text-gray-400"></i>
                        <input type="text" placeholder="Buscar por título, habilidad o palabra clave..." class="w-full pl-10 pr-4 py-3 bg-gray-50 dark:bg-gray-800 border border-transparent focus:border-primary rounded-xl outline-none transition-all text-sm">
                    </div>
                    <select class="px-4 py-3 bg-gray-50 dark:bg-gray-800 rounded-xl outline-none text-sm border border-transparent focus:border-primary">
                        <option>Todas las Categorías</option>
                        <option>Desarrollo Web</option>
                        <option>Apps Móviles</option>
                        <option>Diseño UX/UI</option>
                    </select>
                </div>
            </div>

            <div id="projects-grid" class="grid grid-cols-1 gap-6">
                </div>
        </div>
    </main>

    <script src="js/devlink-utils.js"></script>
    <script>
        // Lógica de Usuario y Tema
        const user = UserManager.getUser();
        const isClient = UserManager.isClient();
        
        document.addEventListener('DOMContentLoaded', function() {
            // Avatar
            document.getElementById('user-avatar').textContent = user.nombre[0];

            // Configuración Sidebar
            NavigationGenerator.initSidebar('projects');

            // Renderizado Condicional
            const grid = document.getElementById('projects-grid');
            const title = document.getElementById('page-title');
            const subtitle = document.getElementById('page-subtitle');

        if (isClient) {
            title.textContent = "Mis Proyectos Publicados";
            subtitle.textContent = "Gestiona el estado y la visibilidad de tus ofertas.";
            document.getElementById('header-action-btn').innerHTML = `
                <button class="bg-primary hover:bg-primary-dark text-white px-5 py-2.5 rounded-xl font-bold text-sm shadow-lg shadow-primary/30 transition-all flex items-center gap-2">
                    <i class="fas fa-plus"></i> <span class="hidden sm:inline">Nuevo Proyecto</span>
                </button>
            `;

            // Proyectos del Cliente (Ejemplo)
            grid.innerHTML = `
                <div class="bg-white dark:bg-gray-900 rounded-3xl p-6 border border-gray-200 dark:border-gray-800 shadow-sm hover:shadow-md transition-all flex flex-col md:flex-row justify-between gap-6">
                    <div class="flex-1">
                        <div class="flex items-center gap-3 mb-2">
                            <span class="px-3 py-1 bg-green-100 dark:bg-green-900/30 text-green-600 text-[10px] font-bold rounded-full uppercase tracking-widest">Abierto</span>
                            <span class="text-xs text-gray-400"><i class="far fa-clock mr-1"></i> Publicado hace 2 días</span>
                        </div>
                        <h3 class="text-xl font-bold mb-2">Desarrollo de App Delivery para Guanare</h3>
                        <p class="text-gray-500 dark:text-gray-400 text-sm mb-4 line-clamp-2">Buscamos un desarrollador fullstack para crear una aplicación móvil de delivery local con geolocalización...</p>
                        <div class="flex items-center gap-4 text-sm font-medium">
                            <span class="flex items-center gap-1 text-gray-600 dark:text-gray-300"><i class="fas fa-file-invoice-dollar text-primary"></i> REF 800 - 1,200</span>
                            <span class="flex items-center gap-1 text-gray-600 dark:text-gray-300"><i class="fas fa-users text-primary"></i> 12 Propuestas</span>
                        </div>
                    </div>
                    <div class="flex flex-col justify-center gap-3 min-w-[140px]">
                        <a href="proposals.html" class="bg-primary/10 text-primary hover:bg-primary hover:text-white py-2 px-4 rounded-xl text-sm font-bold transition-all text-center">Ver Candidatos</a>
                        <button class="border border-gray-200 dark:border-gray-700 text-gray-500 hover:bg-gray-50 dark:hover:bg-gray-800 py-2 px-4 rounded-xl text-sm font-bold transition-all">Editar</button>
                    </div>
                </div>

                <div class="bg-white dark:bg-gray-900 rounded-3xl p-6 border border-gray-200 dark:border-gray-800 shadow-sm opacity-75">
                    <div class="flex items-center gap-3 mb-2">
                        <span class="px-3 py-1 bg-blue-100 dark:bg-blue-900/30 text-blue-600 text-[10px] font-bold rounded-full uppercase tracking-widest">En Progreso</span>
                    </div>
                    <h3 class="text-xl font-bold mb-2">Sistema de Inventario IUTEPI</h3>
                    <div class="mt-4 pt-4 border-t border-gray-100 dark:border-gray-800 flex items-center justify-between">
                        <div class="flex items-center gap-2">
                            <div class="w-8 h-8 rounded-full bg-purple-500 flex items-center justify-center text-white text-xs font-bold">JS</div>
                            <span class="text-sm font-medium">Contratado: Juan Sánchez</span>
                        </div>
                        <a href="contracts.html" class="text-primary text-sm font-bold hover:underline">Ir al Contrato</a>
                    </div>
                </div>
            `;
        } else {
            // Vista Desarrollador
            title.textContent = "Buscar Proyectos";
            subtitle.textContent = "Encuentra tu próximo desafío en Guanare y sus alrededores.";
            document.getElementById('filters-section').classList.remove('hidden');

            grid.innerHTML = `
                <div class="bg-white dark:bg-gray-900 rounded-3xl p-6 border border-gray-200 dark:border-gray-800 shadow-sm hover:border-primary/50 transition-all group">
                    <div class="flex justify-between items-start mb-4">
                        <div class="flex items-center gap-3">
                            <div class="w-12 h-12 bg-gray-100 dark:bg-gray-800 rounded-xl flex items-center justify-center text-xl text-gray-500">
                                <i class="fas fa-building"></i>
                            </div>
                            <div>
                                <h3 class="font-bold text-lg group-hover:text-primary transition-colors">E-commerce de Repuestos</h3>
                                <p class="text-xs text-gray-500">Publicado por: Inversiones Los Llanos</p>
                            </div>
                        </div>
                        <span class="px-3 py-1 bg-blue-50 dark:bg-blue-900/20 text-primary text-xs font-bold rounded-lg">Nuevo</span>
                    </div>
                    <p class="text-gray-600 dark:text-gray-300 text-sm mb-6">Necesitamos una tienda en línea integrada con nuestro sistema administrativo actual (A2 Softway). Debe soportar múltiples listas de precios.</p>
                    
                    <div class="flex flex-wrap gap-2 mb-6">
                        <span class="px-2 py-1 bg-gray-100 dark:bg-gray-800 text-gray-500 text-[10px] font-bold uppercase rounded">PHP</span>
                        <span class="px-2 py-1 bg-gray-100 dark:bg-gray-800 text-gray-500 text-[10px] font-bold uppercase rounded">SQL</span>
                        <span class="px-2 py-1 bg-gray-100 dark:bg-gray-800 text-gray-500 text-[10px] font-bold uppercase rounded">E-commerce</span>
                    </div>

                    <div class="flex items-center justify-between pt-4 border-t border-gray-100 dark:border-gray-800">
                        <div>
                            <p class="text-[10px] text-gray-400 uppercase font-bold">Presupuesto</p>
                            <p class="text-lg font-black text-gray-900 dark:text-white">REF 600 - 900</p>
                        </div>
                        <button class="bg-gray-900 dark:bg-white text-white dark:text-gray-900 hover:bg-primary dark:hover:bg-primary dark:hover:text-white px-6 py-2 rounded-xl font-bold text-sm transition-all">
                            Ver Detalles
                        </button>
                    </div>
                </div>

                <div class="bg-white dark:bg-gray-900 rounded-3xl p-6 border border-gray-200 dark:border-gray-800 shadow-sm hover:border-primary/50 transition-all group">
                    <div class="flex justify-between items-start mb-4">
                        <div class="flex items-center gap-3">
                            <div class="w-12 h-12 bg-orange-100 dark:bg-orange-900/20 rounded-xl flex items-center justify-center text-xl text-orange-500">
                                <i class="fas fa-utensils"></i>
                            </div>
                            <div>
                                <h3 class="font-bold text-lg group-hover:text-primary transition-colors">Menú Digital QR</h3>
                                <p class="text-xs text-gray-500">Publicado por: Restaurant El Fogón</p>
                            </div>
                        </div>
                    </div>
                    <p class="text-gray-600 dark:text-gray-300 text-sm mb-6">Desarrollo de una landing page rápida para mostrar menú digital accesible vía código QR. Debe ser autoadministrable.</p>
                    
                    <div class="flex flex-wrap gap-2 mb-6">
                        <span class="px-2 py-1 bg-gray-100 dark:bg-gray-800 text-gray-500 text-[10px] font-bold uppercase rounded">Frontend</span>
                        <span class="px-2 py-1 bg-gray-100 dark:bg-gray-800 text-gray-500 text-[10px] font-bold uppercase rounded">React</span>
                    </div>

                    <div class="flex items-center justify-between pt-4 border-t border-gray-100 dark:border-gray-800">
                        <div>
                            <p class="text-[10px] text-gray-400 uppercase font-bold">Presupuesto</p>
                            <p class="text-lg font-black text-gray-900 dark:text-white">REF 150 - 250</p>
                        </div>
                        <button class="bg-gray-900 dark:bg-white text-white dark:text-gray-900 hover:bg-primary dark:hover:bg-primary dark:hover:text-white px-6 py-2 rounded-xl font-bold text-sm transition-all">
                            Ver Detalles
                        </button>
                    </div>
                </div>
            `;
        }

        // Script de Modo Oscuro
        const themeToggleBtn = document.getElementById('theme-toggle');
        const darkIcon = document.getElementById('theme-icon');
        const themeText = document.getElementById('theme-text');

        function updateTheme() {
            if (document.documentElement.classList.contains('dark')) {
                darkIcon.className = 'fas fa-sun w-5';
                themeText.textContent = 'Modo Claro';
            } else {
                darkIcon.className = 'fas fa-moon w-5';
                themeText.textContent = 'Modo Oscuro';
            }
        }
        themeToggleBtn.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
            localStorage.setItem('color-theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
            updateTheme();
        });
        if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
            updateTheme();
        });
        
        // Theme functions
        function updateTheme() {
            if (document.documentElement.classList.contains('dark')) {
                darkIcon.className = 'fas fa-sun w-5';
                themeText.textContent = 'Modo Claro';
            } else {
                darkIcon.className = 'fas fa-moon w-5';
                themeText.textContent = 'Modo Oscuro';
            }
        }
    </script>
</body>
</html>
