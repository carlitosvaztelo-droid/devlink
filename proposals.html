<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Propuestas - DevLink</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {'sans': ['Inter', 'system-ui', 'sans-serif']},
                    colors: {
                        primary: {light: '#2563eb', DEFAULT: '#3b82f6', dark: '#1e40af'},
                        'gray-950': '#030712',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-white min-h-screen flex overflow-hidden">

    <aside class="w-20 lg:w-72 bg-white dark:bg-gray-900 border-r border-gray-200 dark:border-gray-800 flex flex-col z-30 transition-all">
        <div class="p-6">
            <div class="flex items-center gap-3 mb-10">
                <div class="w-10 h-10 bg-primary rounded-xl flex items-center justify-center text-white shadow-lg shadow-primary/30">
                    <i class="fas fa-link text-xl"></i>
                </div>
                <span class="text-2xl font-bold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-primary to-cyan-400 hidden lg:block">DevLink</span>
            </div>
            <nav id="sidebar-nav" class="space-y-2"></nav>
        </div>
        <div class="mt-auto p-6">
             <button id="theme-toggle" class="w-full flex items-center gap-3 px-4 py-3 text-gray-500 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-xl">
                <i class="fas fa-adjust w-5"></i><span class="hidden lg:block">Cambiar Tema</span>
            </button>
        </div>
    </aside>

    <main class="flex-1 overflow-y-auto p-8 custom-scrollbar">
        <header class="mb-10 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
                <h1 id="page-title" class="text-3xl font-black tracking-tight">Propuestas</h1>
                <p id="page-desc" class="text-gray-500 dark:text-gray-400 mt-1">Gestión de talento y ofertas laborales.</p>
            </div>
        </header>

        <div id="proposals-container" class="space-y-6 max-w-5xl mx-auto">
            </div>
    </main>

    <script>
        const user = JSON.parse(localStorage.getItem('devlink_demo_user')) || { type: 'dev' };
        const isClient = user.type === 'client';

        // Sidebar
        const nav = document.getElementById('sidebar-nav');
        const dashboardUrl = isClient ? 'dashboard_cliente.html' : 'dashboard_desarrollador.html';
        nav.innerHTML = `
            <a href="${dashboardUrl}" class="flex items-center gap-3 px-4 py-3 text-gray-500 hover:text-primary hover:bg-blue-50 dark:hover:bg-gray-800 rounded-xl transition-all">
                <i class="fas fa-th-large w-5"></i><span class="font-medium hidden lg:block">Dashboard</span>
            </a>
            <a href="projects.html" class="flex items-center gap-3 px-4 py-3 text-gray-500 hover:text-primary hover:bg-blue-50 dark:hover:bg-gray-800 rounded-xl transition-all">
                <i class="fas fa-layer-group w-5"></i><span class="font-medium hidden lg:block">${isClient ? 'Mis Publicaciones' : 'Explorar Proyectos'}</span>
            </a>
            <a href="proposals.html" class="flex items-center gap-3 px-4 py-3 bg-primary text-white rounded-xl shadow-lg shadow-primary/30">
                <i class="fas fa-file-alt w-5"></i><span class="font-medium hidden lg:block">${isClient ? 'Candidatos' : 'Mis Postulaciones'}</span>
            </a>
            <a href="contracts.html" class="flex items-center gap-3 px-4 py-3 text-gray-500 hover:text-primary hover:bg-blue-50 dark:hover:bg-gray-800 rounded-xl transition-all">
                <i class="fas fa-file-signature w-5"></i><span class="font-medium hidden lg:block">Contratos</span>
            </a>
             <a href="messages.html" class="flex items-center gap-3 px-4 py-3 text-gray-500 hover:text-primary hover:bg-blue-50 dark:hover:bg-gray-800 rounded-xl transition-all">
                <i class="fas fa-comment-dots w-5"></i><span class="font-medium hidden lg:block">Mensajes</span>
            </a>
             <a href="profile.html" class="flex items-center gap-3 px-4 py-3 text-gray-500 hover:text-primary hover:bg-blue-50 dark:hover:bg-gray-800 rounded-xl transition-all">
                <i class="fas fa-user-circle w-5"></i><span class="font-medium hidden lg:block">Mi Perfil</span>
            </a>
        `;

        // Contenido Principal
        const container = document.getElementById('proposals-container');
        
        if (isClient) {
            document.getElementById('page-title').textContent = "Candidatos Recibidos";
            document.getElementById('page-desc').textContent = "Revisa las propuestas de los desarrolladores para tus proyectos.";

            container.innerHTML = `
                <div class="bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-3xl p-6 shadow-sm hover:shadow-md transition-all">
                    <div class="flex flex-col md:flex-row justify-between gap-6">
                        <div class="flex gap-4">
                            <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-blue-400 to-indigo-600 flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-blue-500/30">
                                RV
                            </div>
                            <div>
                                <h3 class="text-lg font-bold">Roberto Vázquez</h3>
                                <p class="text-sm text-gray-500">Desarrollador Fullstack PHP</p>
                                <div class="flex gap-1 text-yellow-400 text-xs mt-1">
                                    <i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i>
                                </div>
                            </div>
                        </div>
                        <div class="text-left md:text-right">
                            <p class="text-[10px] text-gray-400 font-bold uppercase tracking-wider">Oferta para</p>
                            <p class="font-semibold text-primary">App Delivery Guanare</p>
                            <p class="text-2xl font-black mt-1">REF 1,100</p>
                        </div>
                    </div>
                    
                    <div class="mt-6 bg-gray-50 dark:bg-gray-800/50 rounded-2xl p-4 text-sm text-gray-600 dark:text-gray-300 italic border border-gray-100 dark:border-gray-800">
                        "Hola, tengo experiencia desarrollando aplicaciones similares en la región. Propongo usar Laravel para el backend para garantizar estabilidad..."
                    </div>

                    <div class="mt-6 flex flex-wrap gap-3">
                        <button class="flex-1 md:flex-none bg-primary hover:bg-primary-dark text-white px-6 py-3 rounded-xl font-bold text-sm shadow-lg shadow-primary/20 transition-all">
                            <i class="fas fa-check-circle mr-2"></i> Aceptar Propuesta
                        </button>
                        <a href="messages.html" class="flex-1 md:flex-none bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 text-gray-700 dark:text-gray-300 hover:text-primary px-6 py-3 rounded-xl font-bold text-sm text-center transition-all">
                            <i class="fas fa-comment-dots mr-2"></i> Mensaje
                        </a>
                        <a href="profile.html" class="flex-1 md:flex-none bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 text-gray-700 dark:text-gray-300 hover:text-primary px-6 py-3 rounded-xl font-bold text-sm text-center transition-all">
                            Ver Perfil
                        </a>
                    </div>
                </div>
            `;
        } else {
            document.getElementById('page-title').textContent = "Mis Postulaciones";
            document.getElementById('page-desc').textContent = "Estado de las ofertas que has enviado a clientes.";

            container.innerHTML = `
                <div class="bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-3xl p-6 shadow-sm relative overflow-hidden">
                    <div class="absolute top-0 right-0 w-32 h-32 bg-yellow-400/10 rounded-bl-[100px] pointer-events-none"></div>
                    
                    <div class="flex justify-between items-start mb-4 relative z-10">
                        <div>
                            <span class="px-3 py-1 bg-yellow-100 dark:bg-yellow-900/30 text-yellow-600 text-[10px] font-bold rounded-full uppercase tracking-widest mb-2 inline-block">En Revisión</span>
                            <h3 class="text-xl font-bold">Sistema Contable Pequeño</h3>
                            <p class="text-xs text-gray-500 mt-1">Cliente: Inversiones El Campo</p>
                        </div>
                        <div class="text-right">
                            <p class="text-[10px] text-gray-400 uppercase font-bold">Tu Oferta</p>
                            <p class="text-xl font-black text-gray-900 dark:text-white">REF 450</p>
                        </div>
                    </div>

                    <div class="flex items-center gap-2 mt-4 pt-4 border-t border-gray-100 dark:border-gray-800">
                        <i class="fas fa-info-circle text-gray-400"></i>
                        <p class="text-xs text-gray-500">El cliente vio tu propuesta hace 2 horas.</p>
                        <button class="ml-auto text-red-500 text-xs font-bold hover:underline">Retirar Oferta</button>
                    </div>
                </div>

                <div class="bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-3xl p-6 shadow-sm relative overflow-hidden opacity-75">
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <span class="px-3 py-1 bg-red-100 dark:bg-red-900/30 text-red-600 text-[10px] font-bold rounded-full uppercase tracking-widest mb-2 inline-block">Rechazada</span>
                            <h3 class="text-xl font-bold text-gray-500 line-through decoration-gray-400">Página Web Corporativa</h3>
                        </div>
                         <div class="text-right">
                            <p class="text-[10px] text-gray-400 uppercase font-bold">Tu Oferta</p>
                            <p class="text-xl font-black text-gray-500">REF 300</p>
                        </div>
                    </div>
                    <p class="text-xs text-red-500 mt-2">El cliente eligió a otro candidato.</p>
                </div>
            `;
        }

        // Theme Logic
        const themeToggle = document.getElementById('theme-toggle');
        if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }
        themeToggle.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
            localStorage.setItem('color-theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
        });
    </script>
</body>
</html>
